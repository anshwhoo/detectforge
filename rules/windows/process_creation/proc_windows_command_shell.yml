title: Suspicious Windows Command Shell Redirection Chaining
id: 0b914660-40ff-42f7-9ed9-a3b23442c124
status: experimental
description: Detects cmd.exe invoked with an output-redirection-then-chained-read pattern (write a file, then immediately display it in the same command line), a shape often seen when a command shell is used to stage or verify dropped content.
author: DetectForge Team
date: 2026/08/16
references:
  - https://attack.mitre.org/techniques/T1059/003/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1059.003/T1059.003.md
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\cmd.exe'
    CommandLine|contains|all:
      - '>'
      - '&'
  condition: selection
falsepositives:
  - Legitimate batch scripts that redirect output to a file and then chain a follow-up command
level: medium
tags:
  - attack.execution
  - attack.t1059.003
