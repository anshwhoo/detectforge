title: Suspicious Scheduled Task Creation via Schtasks
id: 5cc899d7-1476-415f-b4b7-760d7cdffec7
status: experimental
description: Detects creation of a scheduled task via schtasks.exe, which is commonly used by adversaries for persistence.
author: DetectForge Team
date: 2026/08/12
references:
  - https://attack.mitre.org/techniques/T1053/005/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1053.005/T1053.005.md
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains|all:
      - '/create'
  condition: selection
falsepositives:
  - Legitimate administrative software deployment scripts
level: medium
tags:
  - attack.persistence
  - attack.t1053.005
