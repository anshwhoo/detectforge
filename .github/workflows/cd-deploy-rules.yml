name: "DetectForge CD — Deploy Rules to SIEM"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rules/**'
      - 'config/**'

jobs:
  deploy-and-tag:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # actions/setup-python@v5's own install step is what's unstable on this self-hosted
      # runner - confirmed across three attempts (3.11, 3.12, 3.13) that the crash isn't
      # tied to a specific Python version, it's the action's download/install mechanism
      # itself hanging and taking the whole runner process down with it. Skipping the
      # action entirely and pointing PATH at the Python 3.13 already confirmed working
      # standalone on this machine avoids that install step altogether.
      - name: Use local Python 3.13
        shell: powershell
        run: |
          $pythonDir = "C:\Users\ANSHUMAN ROY\AppData\Local\Programs\Python\Python313"
          if (-not (Test-Path "$pythonDir\python.exe")) {
            throw "Python 3.13 not found at $pythonDir - update this path if it moves"
          }
          echo $pythonDir >> $env:GITHUB_PATH
          echo "$pythonDir\Scripts" >> $env:GITHUB_PATH

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1. Deploy Sigma Rules to Wazuh / OpenSearch API
        run: python scripts/deploy_rules.py
        env:
          SIEM_API_URL: ${{ secrets.SIEM_API_URL }}
          SIEM_API_TOKEN: ${{ secrets.SIEM_API_TOKEN }}

      - name: 2. Generate Updated ATT&CK Coverage Layer
        run: python scripts/generate_attack_layer.py

      # Replaced stefanzweifel/git-auto-commit-action@v5: it shells out internally in a
      # way that isn't compatible with this Windows self-hosted runner ("Invalid status
      # code: 127" - command not found). Plain git commands work fine here, as proven by
      # every manual push/PR done against this runner all session.
      - name: 3. Commit & Push Updated ATT&CK Layer
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # config/attack_coverage_layer.json is deliberately gitignored (it's normally a
          # generated artifact) - but this step's whole purpose is to commit that exact
          # generated file back, so -f is needed to override the ignore for this one
          # intentional case. Without it, git add silently adds nothing and this step
          # always reports "no changes" even when the coverage data genuinely changed.
          git add -f config/attack_coverage_layer.json
          $changes = git diff --cached --name-only
          if ($changes) {
            git commit -m "chore(cd): update live MITRE ATT&CK coverage layer [skip ci]"
            git push
          } else {
            Write-Output "No changes to ATT&CK coverage layer, skipping commit."
          }
